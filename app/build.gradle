apply plugin: 'com.android.application'

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.topsky.gasdatapop"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }

    signingConfigs {
        release {
            storeFile file('ti.jks')
            storePassword "topsky"
            keyAlias "topsky"
            keyPassword "topsky"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false //启用混淆
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false //启用混淆
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions
            {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    // 权限请求框架：https://github.com/getActivity/XXPermissions
    implementation 'com.github.getActivity:XXPermissions:26.5'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    // rxjava
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.2'
    implementation 'io.reactivex.rxjava2:rxjava:2.1.12'
    //https://github.com/greenrobot/EventBus
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation "io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.1.4"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.activity:activity:1.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    //https://github.com/wasabeef/glide-transformations
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    // 悬浮窗框架：https://github.com/getActivity/EasyWindow
    implementation 'com.github.getActivity:EasyWindow:13.2'
    //https://github.com/yutils/YSerialPort
    implementation 'com.kotlinx:yserialport:2.2.8'

    //https://github.com/junixapp/XPopup
    implementation 'com.github.li-xiaojun:XPopup:2.10.0'

    //消息总线 https://github.com/JeremyLiao/LiveEventBus
    //https://github.com/JeremyLiao/LiveEventBus/issues/173
    implementation 'com.github.neo-turak:LiveEventBus:1.8.1'

    //万能阴影布局-ShadowLayout https://github.com/lihangleo2/ShadowLayout?tab=readme-ov-file
    implementation 'com.github.lihangleo2:ShadowLayout:3.4.5'
}